services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./law.json:/app/law.json:ro
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:5173
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_JEV_MODEL: ${OPENROUTER_JEV_MODEL:-~typesafe/jev-latest}
      OPENROUTER_VAR_MODEL: ${OPENROUTER_VAR_MODEL:-~openai/gpt-sol-latest}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}

  web:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
